# Stage2 設定檔
# 對應 proposal §6.3 + 開發計畫 §7.7 (stage2 區段)

input:
  # 相對路徑以「專案根目錄」為基準
  ideal_portfolio: MILP_phase_1/output/ideal_portfolio.json
  prices: data/processed/prices.parquet

portfolio:
  C0: 1.0e+7                # 期初現金（元）— 預設 1000 萬，對齊 Stage 1 V0
  initial_holdings: {}       # {stock_id: x0_lots}；空 = 首期、全現金起跑
  # V0 = C0 + Σ P_i * x0_lots（自動計算，1 張 = 1000 股）

stage2:
  c_buy: 0.001425            # 買入手續費率（券商）
  c_sell: 0.004425           # 賣出手續費率（券商 0.1425% + 證交稅 0.3%）
  lambda_trade: 0.0005       # 交易標的數懲罰係數（避免零碎交易）
  L: 0.01                    # 持股時的最低權重（對齊 Stage 1）
  U: 0.10                    # 單檔最高權重（對齊 Stage 1）

solver:
  backend: "cbc"             # cbc / gurobi / auto
  time_limit: 60             # 秒
  mip_gap: 0.005
  verbose: false
